# Standalone (not inherit_from ../.rubocop.yml): the root config excludes
# hibiki_rails/**/*, and inherited Exclude paths resolve relative to the
# defining file — inheriting would exclude every file here. Standalone is
# also what the gem needs at extraction time. Keep style in sync with root.
AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Spec blocks are naturally long, and specs define fixture channels whose
# build_graph methods read like real apps — don't squeeze those.
Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - "*.gemspec"

Metrics/AbcSize:
  Exclude:
    - spec/**/*

Metrics/MethodLength:
  Exclude:
    - spec/**/*

# A Thor generator's public methods ARE its sequence of steps, so its length
# tracks how much it emits rather than how tangled it is. Three real concerns
# have already been extracted out of this one (the column model, the view
# argument lists, the model injection and the post-install notices); what is
# left is the step sequence plus option plumbing, and splitting that further
# would scatter the order of operations across files.
Metrics/ClassLength:
  Exclude:
    - lib/generators/hibiki/rails/scaffold_controller/scaffold_controller_generator.rb

# The --css token map is a data table, not logic: ~40 named class strings
# transcribed from three hand-built, browser-verified variants. Splitting it to
# satisfy a line count would separate the tokens from the accessor that
# validates them and buy nothing.
#
# The two view-helper modules are the same shape: flat collections of small
# emitters, one per thing a template needs to say, each a few lines and none
# calling another except through the head/tail pairs that exist precisely so
# the two view layers cannot drift. Their length tracks how much the templates
# emit; splitting them by count would put a builder in one file and its twin in
# another, which is the one thing this design is trying to prevent.
Metrics/ModuleLength:
  Exclude:
    # One cohesive protocol — hydrate/serialize/commit — where the nested
    # half of each method belongs beside its scalar half; a line-count split
    # would put part of hydrate's contract in another file.
    - lib/hibiki/rails/reactive_form.rb
    - lib/generators/hibiki/rails/css_variant.rb
    - lib/generators/hibiki/rails/scaffold_view_helpers.rb
    - lib/generators/hibiki/rails/scaffold_phlex_helpers.rb
    # Same shape again: one naming helper and one guarded injection per thing
    # the multiselect touches, none calling another.
    - lib/generators/hibiki/rails/multiselect_helpers.rb
    - lib/generators/hibiki/rails/multiselect_injections.rb

# Keyword arguments don't have the readability problem this cop targets —
# they name themselves at the call site. Helpers#on is the case in point:
# every modifier it grew is optional and keyword-only.
Metrics/ParameterLists:
  CountKeywordArgs: false
